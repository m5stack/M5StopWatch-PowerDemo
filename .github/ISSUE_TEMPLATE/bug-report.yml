name: Bug report
description: Report a reproducible firmware, hardware-interaction, or power-test issue.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with M5StopWatch Power Demo.
        Do not include Wi-Fi passwords or other credentials in this report.

  - type: input
    id: test-project
    attributes:
      label: Test firmware
      description: Enter the test project directory that reproduces the issue.
      placeholder: tests/l0_shutdown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe what happened and how it affects the test result.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the exact build configuration and steps needed to reproduce the issue.
      placeholder: |
        1. Initialize submodules.
        2. Build tests/...
        3. Flash the production M5StopWatch hardware.
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the versions needed to reproduce the result.
      value: |
        - ESP-IDF version: 5.5.5
        - Host OS:
        - Hardware revision:
        - Repository commit:
    validations:
      required: true

  - type: textarea
    id: firmware-configuration
    attributes:
      label: Firmware configuration
      description: Provide the reported identifiers and relevant local configuration without credentials.
      value: |
        - test_id:
        - config_id:
        - PROFILE:
        - Relevant sdkconfig overrides:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected firmware state, wake result, or power behavior.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Functional validation logs
      description: Add the relevant Stage A serial output, if available. Remove credentials and unrelated data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: power-evidence
    attributes:
      label: Power measurement evidence
      description: For power issues, attach the capture and state the voltage, current value, and measurement conditions.
      placeholder: |
        - Supply voltage:
        - WINDOW Avg:
        - Measurement conditions:
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for existing reports of this issue.
          required: true
        - label: I removed Wi-Fi passwords and other credentials from this report.
          required: true
