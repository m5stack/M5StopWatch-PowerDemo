name: clang-format check

env:
  INCLUDE_REGEX: ^.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl)$

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**/*.c'
      - 'modules/**/*.cc'
      - 'modules/**/*.cpp'
      - 'modules/**/*.cxx'
      - 'modules/**/*.h'
      - 'modules/**/*.hh'
      - 'modules/**/*.hpp'
      - 'modules/**/*.hxx'
      - 'modules/**/*.inl'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.cxx'
      - 'tests/**/*.h'
      - 'tests/**/*.hh'
      - 'tests/**/*.hpp'
      - 'tests/**/*.hxx'
      - 'tests/**/*.inl'
      - '.clang-format'
      - '.github/workflows/clang-format-check.yml'
  pull_request:
    paths:
      - 'modules/**/*.c'
      - 'modules/**/*.cc'
      - 'modules/**/*.cpp'
      - 'modules/**/*.cxx'
      - 'modules/**/*.h'
      - 'modules/**/*.hh'
      - 'modules/**/*.hpp'
      - 'modules/**/*.hxx'
      - 'modules/**/*.inl'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.cxx'
      - 'tests/**/*.h'
      - 'tests/**/*.hh'
      - 'tests/**/*.hpp'
      - 'tests/**/*.hxx'
      - 'tests/**/*.inl'
      - '.clang-format'
      - '.github/workflows/clang-format-check.yml'
  workflow_dispatch:

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - modules
          - tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project-owned C/C++ formatting
        uses: jidicula/clang-format-action@v4.10.2
        with:
          clang-format-version: '18'
          check-path: ${{ matrix.path }}
          include-regex: ${{ env.INCLUDE_REGEX }}
